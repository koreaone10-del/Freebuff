name: Freebuff CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Node application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Render-compatible smoke test
        shell: bash
        run: |
          PORT=18765 npm start > /tmp/chibani-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18765/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          node -e 'const fs=require("node:fs"); const j=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(!j.ok || !Array.isArray(j.providers) || j.media.imageRequiresUserKey !== false || j.media.trueTextToVideo !== false) process.exit(1); console.log(`health OK: ${j.providers.length} no-key provider/model entries`);'
          curl --fail --silent http://127.0.0.1:18765/ | grep -q 'CHIBANI'
          curl --fail --silent http://127.0.0.1:18765/ | grep -q 'leaflet@1.9.4'
